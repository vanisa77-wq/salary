<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肖像同意書回條回收追蹤表</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif;
    background:#EDE6E3; color:#1a1a1a; font-size:15px; line-height:1.7;
  }
  .wrap { max-width:720px; margin:0 auto; padding:12px 12px 40px; }
  .card {
    background:#FAF7F5; border-radius:10px; padding:16px 14px;
    margin-bottom:12px; box-shadow:0 1px 4px rgba(140,120,115,.15);
  }
  h1 { font-size:18px; text-align:center; letter-spacing:2px; margin-bottom:4px; }
  .sub { text-align:center; font-size:13px; color:#333; margin-bottom:8px; }
  h2 { font-size:16px; margin-bottom:8px; border-left:4px solid #C9A9A6; padding-left:8px; }
  textarea {
    width:100%; font-size:15px; padding:10px; border:1px solid #C9B8B4;
    border-radius:8px; background:#fff; color:#1a1a1a; font-family:inherit;
    min-height:110px; resize:vertical;
  }
  .hint { font-size:13px; color:#333; margin:6px 0; }
  .btn {
    border:none; border-radius:8px; font-size:15px; font-family:inherit;
    padding:10px 14px; cursor:pointer; margin:6px 6px 0 0; letter-spacing:1px;
  }
  .btn-main { background:#B98E8A; color:#fff; font-weight:bold; }
  .btn-sub { background:#DDD0CC; color:#333; font-size:14px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .stat {
    flex:1; min-width:100px; background:#fff; border:1px solid #C9B8B4;
    border-radius:8px; text-align:center; padding:8px 4px;
  }
  .stat .num { font-size:18px; font-weight:bold; }
  .stat .lbl { font-size:13px; color:#333; }
  .stat.pend .num { color:#A5514B; }
  .stat.agree .num { color:#6E8B6E; }
  .stat.disagree .num { color:#8A7A9B; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; }
  th, td { border:1px solid #E3D8D5; padding:8px 6px; font-size:15px; text-align:center; }
  th { background:#F0E4E1; font-size:14px; }
  td.name { text-align:left; padding-left:10px; font-weight:bold; }
  select {
    font-size:15px; font-family:inherit; padding:6px 8px;
    border:1px solid #C9B8B4; border-radius:6px; background:#fff; color:#1a1a1a;
  }
  select.st-pend { background:#F8ECEB; color:#A5514B; }
  select.st-agree { background:#ECF2EC; color:#3E5B3E; }
  select.st-disagree { background:#EFEAF4; color:#5A4A6B; }
  td .date { font-size:13px; color:#333; }
  td .del { color:#A5514B; font-size:13px; cursor:pointer; text-decoration:underline; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; }
  #pendBox {
    display:none; margin-top:10px; background:#fff; border:1px solid #C9B8B4;
    border-radius:8px; padding:10px 12px; white-space:pre-wrap; font-size:15px;
  }
  .empty { text-align:center; color:#8a7f7c; font-size:14px; padding:16px 0; }
  @media (max-width:480px){ th:nth-child(4), td:nth-child(4){ display:none; } }
  body.gate-lock{overflow:hidden}
  #login-gate{position:fixed;inset:0;z-index:99999;background:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:20px}
  #login-gate .lg-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  #login-gate .lg-title{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:4px;text-align:center}
  #login-gate .lg-sub{font-size:13px;color:#888;text-align:center;margin-bottom:20px}
  #login-gate label{font-size:14px;color:#333;font-weight:500;display:block;margin-bottom:5px}
  #login-gate .lg-field{margin-bottom:14px}
  #login-gate input{width:100%;height:44px;border:1px solid #D5D3CC;border-radius:8px;background:#FAFAF8;color:#1a1a1a;font-size:16px;font-family:inherit;padding:0 12px;outline:none}
  #login-gate input:focus{border-color:#C0392B;box-shadow:0 0 0 3px rgba(192,57,43,.1)}
  #login-gate button{width:100%;height:46px;border:none;border-radius:8px;background:#C0392B;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
  #login-gate button:hover{background:#A93226}
  #login-gate .lg-err{color:#C0392B;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
</style>
</head>
<body class="gate-lock">
<div id="site-nav-bar" style="position:fixed;top:0;left:0;right:0;z-index:100000;background:#2c2c2c;padding:8px 10px;display:flex;gap:8px;overflow-x:auto;font-family:'Microsoft JhengHei','PingFang TC',sans-serif;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);">
  <a href="/" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">💰 月薪計算</a>
  <a href="/daily" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">📅 日薪計算</a>
  <a href="/report" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">📝 請假加班回報</a>
  <a href="/deposit" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">🍎 定位金收據</a>
  <a href="/consent" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">📷 肖像同意書</a>
  <a href="/deposit-track" style="color:#fff;background:#555;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">🔒 定位金追蹤</a>
  <a href="/consent-track" style="color:#fff;background:#C0392B;padding:6px 12px;border-radius:6px;text-decoration:none;flex-shrink:0;">🔒 同意書回傳</a>
</div>
<div style="height:44px;"></div>

<div id="login-gate">
  <div class="lg-card">
    <div class="lg-title">🔒 小蘋果托嬰中心｜同意書回收追蹤</div>
    <div class="lg-sub">管理員登入</div>
    <div class="lg-field">
      <label>帳號（手機號碼）</label>
      <input type="text" id="lg-email" autocomplete="off" placeholder="請輸入手機號碼">
    </div>
    <div class="lg-field">
      <label>密碼</label>
      <input type="password" id="lg-pass" autocomplete="off" placeholder="請輸入密碼">
    </div>
    <button onclick="tryAdminLogin()">登入</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <h1>肖像同意書回條回收追蹤表</h1>
    <div class="sub">台中市私立小蘋果托嬰中心</div>
    <div class="stats">
      <div class="stat"><div class="num" id="sTotal">0</div><div class="lbl">全園幼兒</div></div>
      <div class="stat agree"><div class="num" id="sReturned">0</div><div class="lbl">已回傳</div></div>
      <div class="stat pend"><div class="num" id="sPend">0</div><div class="lbl">未回傳</div></div>
    </div>
    <div class="stats" style="margin-top:8px;">
      <div class="stat agree"><div class="num" id="sAgree">0</div><div class="lbl">同意</div></div>
      <div class="stat disagree"><div class="num" id="sDis">0</div><div class="lbl">不同意</div></div>
    </div>
  </div>

  <div class="card" id="rosterCard">
    <h2>建立幼兒名單</h2>
    <div class="hint">請貼上幼兒姓名，一行一位。已存在的姓名不會重複加入。</div>
    <textarea id="rosterInput" placeholder="例如：&#10;王小明&#10;林小美&#10;陳小安"></textarea>
    <div class="bar">
      <button class="btn btn-main" onclick="addRoster()">加入名單</button>
      <button class="btn btn-sub" onclick="clearAll()">清空全部資料</button>
    </div>
  </div>

  <div class="card">
    <h2>回收狀況登記</h2>
    <div class="hint">收到家長回條圖片後，於下表更改狀態，日期會自動記錄。</div>
    <table>
      <thead><tr><th style="width:8%">No.</th><th style="width:28%">幼兒姓名</th><th style="width:28%">狀態</th><th style="width:24%">收件日期</th><th style="width:12%">刪除</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg">尚未建立名單，請先於上方貼上幼兒姓名。</div>
    <div class="bar">
      <button class="btn btn-main" onclick="makePendList()">產生未交名單（催繳用）</button>
      <button class="btn btn-sub" onclick="exportCsv()">匯出 CSV 存檔</button>
    </div>
    <div id="pendBox"></div>
  </div>

</div>

<script>
const ADMIN_EMAIL='0931114981';
const ADMIN_PASS='640506';
function unlockGate(){
  document.getElementById('login-gate').style.display='none';
  document.body.classList.remove('gate-lock');
}
function tryAdminLogin(){
  const email=(document.getElementById('lg-email').value||'').trim();
  const pass=(document.getElementById('lg-pass').value||'').trim();
  const err=document.getElementById('lg-err');
  if(email!==ADMIN_EMAIL||pass!==ADMIN_PASS){
    err.textContent='帳號或密碼錯誤';
    document.getElementById('lg-pass').value='';
    return;
  }
  err.textContent='';
  sessionStorage.setItem('consentTrackAuth','1');
  unlockGate();
}
['lg-email','lg-pass'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') tryAdminLogin(); });
});
if(sessionStorage.getItem('consentTrackAuth')==='1') unlockGate();

let data = [];
let canStore = true;
try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); }
catch(e){ canStore = false; }

function load(){
  if(!canStore) return;
  try { const s = localStorage.getItem('consentTrack'); if(s) data = JSON.parse(s); } catch(e){}
}
function save(){
  if(!canStore) return;
  try { localStorage.setItem('consentTrack', JSON.stringify(data)); } catch(e){}
}

function todayStr(){
  const d = new Date();
  return (d.getFullYear()-1911) + '/' + (d.getMonth()+1) + '/' + d.getDate();
}

function addRoster(){
  const lines = document.getElementById('rosterInput').value
    .split('\n').map(s=>s.trim()).filter(s=>s);
  const exist = new Set(data.map(x=>x.name));
  lines.forEach(n=>{ if(!exist.has(n)){ data.push({name:n, status:'未交', date:''}); exist.add(n); } });
  document.getElementById('rosterInput').value = '';
  save(); render();
}

function clearAll(){
  if(!confirm('確定要清空全部名單與紀錄嗎？')) return;
  data = []; save(); render();
}

function setStatus(i, v){
  data[i].status = v;
  data[i].date = (v === '未交') ? '' : todayStr();
  save(); render();
}

function delRow(i){
  if(!confirm('確定刪除「' + data[i].name + '」？')) return;
  data.splice(i,1); save(); render();
}

function render(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  data.forEach((r,i)=>{
    const cls = r.status==='未交' ? 'st-pend' : (r.status==='同意' ? 'st-agree' : 'st-disagree');
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (i+1) + '</td>' +
      '<td class="name">' + r.name + '</td>' +
      '<td><select class="' + cls + '" onchange="setStatus(' + i + ', this.value)">' +
        ['未交','同意','不同意'].map(s=>'<option' + (r.status===s?' selected':'') + '>' + s + '</option>').join('') +
      '</select></td>' +
      '<td><span class="date">' + (r.date || '—') + '</span></td>' +
      '<td><span class="del" onclick="delRow(' + i + ')">刪除</span></td>';
    tb.appendChild(tr);
  });
  document.getElementById('emptyMsg').style.display = data.length ? 'none' : 'block';
  document.getElementById('sTotal').textContent = data.length;
  document.getElementById('sReturned').textContent = data.filter(x=>x.status!=='未交').length;
  document.getElementById('sAgree').textContent = data.filter(x=>x.status==='同意').length;
  document.getElementById('sDis').textContent = data.filter(x=>x.status==='不同意').length;
  document.getElementById('sPend').textContent = data.filter(x=>x.status==='未交').length;
}

function makePendList(){
  const pend = data.filter(x=>x.status==='未交').map(x=>x.name);
  const box = document.getElementById('pendBox');
  box.style.display = 'block';
  if(!pend.length){ box.textContent = '全數已回收，無未交名單。'; return; }
  const txt = '【肖像同意書回條提醒】\n以下幼兒尚未回傳簽名回條，再麻煩家長撥空填寫，謝謝您：\n' +
    pend.map((n,i)=>(i+1) + '. ' + n).join('\n');
  box.textContent = txt;
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>{ alert('未交名單已複製，可直接貼到 LINE。'); }).catch(()=>{});
  }
}

function exportCsv(){
  let csv = '\uFEFF幼兒姓名,狀態,收件日期\n';
  data.forEach(r=>{ csv += r.name + ',' + r.status + ',' + (r.date||'') + '\n'; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = '肖像同意書回收紀錄_' + todayStr().replace(/\//g,'') + '.csv';
  a.click();
}

load(); render();
if(!canStore){
  document.querySelector('.sub').textContent += '（此瀏覽器無法儲存資料，請於填寫後匯出 CSV 保存）';
}
</script>
</body>
</html>
