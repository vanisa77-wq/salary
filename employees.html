<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小蘋果托嬰中心｜員工資料管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --fill:#B0705A;
  --accent:#C08268;
  --accent-deep:#8C5442;
  --tint:#FAEDE6;
  --tint-mid:#F3DCD1;
  --border:#EBD3C7;
  --border-mid:#E2C3B4;
  --zebra:#FEFAF7;
  --divider:#F6EBE4;
  --hover:#FCF4EE;
  --danger:#A8503F;
  --ink:#33322F;
  --ink-soft:#7A7873;
  --ink-faint:#A3A19B;
  --page-bg:#FBF6F2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',sans-serif;background:var(--page-bg);color:var(--ink);font-size:18.5px;line-height:1.6}
.num{font-family:'Nunito','Noto Sans TC',sans-serif}
svg.ic{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:0 0 auto}
.topbar{background:#1a1a1a;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:20.5px;font-weight:700}
.topbar a{font-size:16px;color:#EDD9CE;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.topbar a:hover{color:#fff}
.container{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.intro{background:var(--tint);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:15px;color:var(--ink-soft);line-height:1.75}
.intro b{color:var(--ink)}
.intro .ok{color:#4E7D5B;margin-top:4px;display:block}

body.gate-lock{overflow:hidden}
#login-gate{position:fixed;inset:0;z-index:99999;background:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:20px}
#login-gate .lg-card{background:#fff;border-radius:16px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#login-gate .lg-title{font-size:19.5px;font-weight:700;color:#1a1a1a;margin-bottom:4px;text-align:center}
#login-gate .lg-sub{font-size:15px;color:#888;text-align:center;margin-bottom:20px}
#login-gate label{font-size:16px;color:#333;font-weight:500;display:block;margin-bottom:5px}
#login-gate .lg-field{margin-bottom:14px}
#login-gate input{width:100%;height:44px;border:1px solid #D5D3CC;border-radius:8px;background:#FAFAF8;color:#1a1a1a;font-size:18.5px;font-family:inherit;padding:0 12px;outline:none}
#login-gate input:focus{border-color:var(--fill);box-shadow:0 0 0 3px rgba(176,112,90,.15)}
#login-gate button{width:100%;height:46px;border:none;border-radius:8px;background:var(--fill);color:#fff;font-size:18.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
#login-gate button:hover{background:var(--accent-deep)}
#login-gate .lg-err{color:var(--danger);font-size:15px;text-align:center;margin-top:10px;min-height:18px}

/* ===== 員工清單卡片 ===== */
.list-card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px}
.list-head{background:var(--fill);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.list-head .lh-left{display:flex;align-items:center;gap:10px}
.list-head h2{font-size:18.5px;font-weight:700}
.list-head .sync{font-size:13px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px}
.list-head .lh-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:20px;padding:7px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn-ghost-light{background:rgba(255,255,255,.16);color:#fff}
.btn-ghost-light:hover{background:rgba(255,255,255,.28)}
.btn-solid-dark{background:var(--accent-deep);color:#fff}
.btn-solid-dark:hover{background:#734334}
.btn-fill{background:var(--fill);color:#fff}
.btn-fill:hover{background:var(--accent-deep)}
.btn-outline{background:#fff;border:1px solid var(--border-mid);color:var(--ink)}
.btn-outline:hover{background:var(--hover)}
.btn-dashed{background:transparent;border:1px dashed var(--border-mid);color:var(--ink-soft)}
.btn-dashed:hover{background:var(--hover)}
.btn-icon{background:transparent;border:1px solid var(--border-mid);border-radius:20px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft)}
.btn-icon:hover{background:var(--hover);color:var(--ink)}
.btn-icon.danger{color:var(--danger);border-color:#EBC9C2}
.btn-icon.danger:hover{background:#FBEEEC}
.pill-resigned{background:var(--tint-mid);color:var(--ink-soft);border:1px solid var(--border-mid);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:700}

table.emp-table{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
table.emp-table col.c-no{width:32px}
table.emp-table col.c-name{width:110px}
table.emp-table col.c-tenure{width:168px}
table.emp-table col.c-base{width:92px}
table.emp-table col.c-bonus{width:88px}
table.emp-table col.c-grade{width:94px}
table.emp-table col.c-op{width:64px}
table.emp-table thead th{background:var(--tint-mid);color:var(--ink-soft);font-size:14px;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
table.emp-table thead th.r{text-align:right}
table.emp-table thead th.c{text-align:center}
table.emp-table tbody tr.emp-row{border-bottom:1px solid var(--divider);cursor:pointer}
table.emp-table tbody tr.emp-row:nth-child(even){background:var(--zebra)}
table.emp-table tbody tr.emp-row:hover{background:var(--hover)}
table.emp-table tbody tr.emp-row.resigned{opacity:.62}
table.emp-table td{padding:7px 10px;vertical-align:middle}
table.emp-table td.r{text-align:right}
table.emp-table td.c{text-align:center}
.name-cell{display:flex;align-items:center;gap:7px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fill);flex:0 0 auto}
.dot.off{background:transparent;border:1.5px solid var(--ink-faint)}
.tenure-cell{display:flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:14.5px}
.tenure-cell svg{color:var(--accent)}
.base-cell{color:var(--accent-deep);font-weight:700}
.dash{color:var(--ink-faint)}
.resign-sep td{background:var(--tint);color:var(--ink-soft);font-weight:700;font-size:14.5px;padding:8px 10px;border-bottom:1px solid var(--border)}
.list-foot{display:flex;gap:22px;flex-wrap:wrap;padding:10px 18px;background:var(--tint);font-size:14.5px;color:var(--ink-soft)}
.list-foot b{color:var(--ink);font-weight:700}

/* ===== 展開詳細 ===== */
.detail-wrap{background:var(--page-bg);border-top:1px solid var(--border);padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.detail-head .dh-name{font-size:19.5px;font-weight:700;color:var(--ink)}
.detail-head .dh-sub{font-size:14px;color:var(--ink-faint);margin-top:2px}
.detail-head .dh-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.detail-head .dh-stats .s-label{font-size:12.5px;color:var(--ink-faint);display:block}
.detail-head .dh-stats .s-val{font-size:15.5px;font-weight:700;color:var(--ink)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--accent-deep);margin-bottom:10px}
.card-title .badge{margin-left:auto;background:var(--tint-mid);color:var(--accent-deep);font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.card-title .clear-link{margin-left:auto;font-size:13px;color:var(--ink-faint);background:none;border:none;cursor:pointer;text-decoration:underline}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.row2{grid-template-columns:1fr}}
.f-line{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.f-line:last-child{margin-bottom:0}
.f-label{width:68px;flex:0 0 68px;font-size:14.5px;color:var(--ink-soft)}
.f-input,.f-select{flex:1;height:34px;border:1px solid var(--border-mid);border-radius:8px;padding:0 10px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
.f-input.num-input{font-family:'Nunito',sans-serif;font-weight:700}
.f-input:disabled{background:var(--divider);color:var(--ink-faint)}
.check-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-soft);margin-top:6px}
.help-text{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-top:8px}
.dep-table{width:100%;border-collapse:collapse;font-size:15px}
.dep-table th{text-align:left;font-size:13px;color:var(--ink-faint);font-weight:700;padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.dep-table td{padding:5px 6px;vertical-align:middle}
.dep-table tr:nth-child(even){background:var(--zebra)}
.tag-billable{color:var(--danger);font-size:13px;font-weight:700;background:#FBEEEC;border-radius:6px;padding:2px 7px}
.tag-exempt{color:#4E7D5B;font-size:13px;font-weight:700;background:#E7F1EA;border-radius:6px;padding:2px 7px}
.allow-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
</style>
</head>

<script>
// 登入保護改用真正的 Supabase Auth 帳密（sb 由下方 Supabase 區塊建立），
// 不再是寫死在網頁原始碼裡的手機號碼／密碼。
function unlockGate(){
  document.getElementById('login-gate').style.display='none';
  document.body.classList.remove('gate-lock');
  document.body.classList.add('gate-unlocked');
  loadEmployeeDB();
}
async function tryAdminLogin(){
  var email=(document.getElementById('lg-email').value||'').trim();
  var pass=(document.getElementById('lg-pass').value||'').trim();
  var err=document.getElementById('lg-err');
  var result=await sb.auth.signInWithPassword({ email:email, password:pass });
  if(result.error){
    err.textContent='帳號或密碼錯誤';
    document.getElementById('lg-pass').value='';
    return;
  }
  err.textContent='';
  unlockGate();
}
['lg-email','lg-pass'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',function(e){
    if(e.key==='Enter')tryAdminLogin();
  });
});

/* ===== Supabase ===== */

const sb = initSupabase();
if(sb) sb.auth.getSession().then(function(res){ if(res.data.session) unlockGate(); });

/* ===== 投保級距表（跟薪資系統共用同一組數字） ===== */
const LABOR=[[0x8214,0x341],[0x87f0,0x366],[0x8dcc,0x38c],[0x9538,0x3bb],[0x9ca4,0x3ea],[0xa410,0x41a],[0xab7c,0x44a],[0xb2e8,0x479]];
const HEALTH=[[0x8214,0x204],[0x87f0,0x21c],[0x8dcc,0x233],[0x9538,0x250],[0x9ca4,0x26e],[0xa410,0x28b],[0xab7c,0x2a9],[0xb2e8,0x2c6]];

/* ===== 線性圖示（Lucide 風格） ===== */
function ic(name){

let employeeDB=[];
let dependentsByEmp={};
let allowancesByEmp={};
let expandedEmpId=null;
function rowToEmp(r){return {id:r.id,account:r.account||'',password:r.password||'',name:r.name||'',base:r.base||0,bonus:r.bonus||0,insGrade:r.ins_grade||0,dependents:r.dependents||0,hireDate:r.hire_date||'',resignDate:r.resign_date||'',jobTitle:r.job_title||'',healthInsGrade:r.health_ins_grade||0,laborInsExempt:r.labor_ins_exempt===true,raiseDate:r.raise_effective_date||'',raiseNewBase:r.raise_new_base||0,gradeEffDate:r.grade_effective_date||'',gradeNewGrade:(r.grade_new_ins_grade===null||r.grade_new_ins_grade===undefined)?'':r.grade_new_ins_grade,tenureDeductMonths:r.tenure_deduct_months||0};}
function rocDateFields(prefix,iso,onChangeExpr){
  const p=iso?iso.split('-'):['','',''];
  const y=p[0]?(+p[0]-1911):'',m=p[1]?+p[1]:'',d=p[2]?+p[2]:'';
  const base='height:36px;border:1px solid var(--border-mid);border-radius:6px;padding:0 4px;text-align:center;font-family:inherit;font-size:15px';
  const hy='style="width:62px;'+base+'"';
  const h='style="width:48px;'+base+'"';
  return '<input type="number" id="'+prefix+'-y" value="'+y+'" placeholder="民國" '+hy+' onchange="'+onChangeExpr+'">年'
    +'<input type="number" id="'+prefix+'-m" value="'+m+'" placeholder="月" min="1" max="12" '+h+' onchange="'+onChangeExpr+'">月'
    +'<input type="number" id="'+prefix+'-d" value="'+d+'" placeholder="日" min="1" max="31" '+h+' onchange="'+onChangeExpr+'">日';
}
function readRocDate(prefix){
  const y=+((document.getElementById(prefix+'-y')||{}).value||0);
  const m=+((document.getElementById(prefix+'-m')||{}).value||0);
  const d=+((document.getElementById(prefix+'-d')||{}).value||0);
  if(!y||!m||!d)return '';
  const ad=y+1911;
  return ad+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* 投保級距調整一律當月1號生效，不需要日欄位，只填年／月 */
function rocYearMonthFields(prefix,iso,onChangeExpr){
  const p=iso?iso.split('-'):['',''];
  const y=p[0]?(+p[0]-1911):'',m=p[1]?+p[1]:'';
  const base='height:36px;border:1px solid var(--border-mid);border-radius:6px;padding:0 4px;text-align:center;font-family:inherit;font-size:15px';
  const hy='style="width:62px;'+base+'"';
  const h='style="width:48px;'+base+'"';
  return '<input type="number" id="'+prefix+'-y" value="'+y+'" placeholder="民國" '+hy+' onchange="'+onChangeExpr+'">年'
    +'<input type="number" id="'+prefix+'-m" value="'+m+'" placeholder="月" min="1" max="12" '+h+' onchange="'+onChangeExpr+'">月';
}
function readRocYearMonth(prefix){
  const y=+((document.getElementById(prefix+'-y')||{}).value||0);
  const m=+((document.getElementById(prefix+'-m')||{}).value||0);
  if(!y||!m)return '';
  const ad=y+1911;
  return ad+'-'+String(m).padStart(2,'0')+'-01';
}
function rocDateDisp(iso){
  if(!iso)return '';
  var p=String(iso).split('-');
  if(p.length<3)return iso;
  return (+p[0]-1911)+'/'+(+p[1])+'/'+(+p[2]);
}
function depAge(birthDate){
  if(!birthDate)return null;
  const b=new Date(birthDate);
  if(isNaN(b))return null;
  const today=new Date();
  let age=today.getFullYear()-b.getFullYear();
  const m=today.getMonth()-b.getMonth();
  if(m<0||(m===0&&today.getDate()<b.getDate()))age--;
  return age;
}
function depIsBillable(d){
  if(d.billable_override===true)return true;
  if(d.billable_override===false)return false;
  const age=depAge(d.birth_date);
  if(age===null)return true;
  return age<65;
}
function tenureFull(hireDate, untilDate, deductMonths){
  if(!hireDate) return '';
  var start=new Date(hireDate+'T00:00:00');
  if(isNaN(start)) return '';
  var end=untilDate?new Date(untilDate+'T00:00:00'):new Date();
  if(isNaN(end)||end<start) return '';
  var y=end.getFullYear()-start.getFullYear();
  var m=end.getMonth()-start.getMonth();
  var d=end.getDate()-start.getDate();
  if(d<0){ m--; d+=new Date(end.getFullYear(),end.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  var totalMonths=y*12+m-(+deductMonths||0);
  if(totalMonths<0)totalMonths=0;
  y=Math.floor(totalMonths/12); m=totalMonths%12;
  return y+' 年 '+m+' 個月 '+d+' 天';
}
let piiByEmp={};

  if(!client)return;
  client.from('employee_pii').select('*').then(function(res){
    if(res.error){console.error('讀取員工個資失敗（可能尚未登入或無權限）',res.error);return;}
    piiByEmp={};
    (res.data||[]).forEach(function(p){ piiByEmp[p.employee_id]=p; });
    employeeDB.forEach(function(e){
      const p=piiByEmp[e.id];
      e.birthDate=p?(p.birth_date||''):'';
      e.nationalId=p?(p.national_id||''):'';
    });
    try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(err){}
    renderEmpDBList();
  });
}
function updateEmpPii(i,field,val){
  const emp=employeeDB[i];
  if(!emp||!emp.id)return;
  emp[field]=val;
  try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(e){}
  const client=initSupabase();
  if(!client)return;
  const payload={employee_id:emp.id, birth_date:emp.birthDate||null, national_id:emp.nationalId||null};
  client.from('employee_pii').upsert(payload,{onConflict:'employee_id'}).then(function(res){
    if(res.error)console.error('儲存員工個資失敗',res.error);
  });
}
function loadEmployeeDB(){
  try{
    const cached=localStorage.getItem('scEmployeeDB');
    if(cached)employeeDB=JSON.parse(cached);
  }catch(e){}
  const client=initSupabase();
  if(!client)return;
  client.from('employees').select('*').order('id').then(function(res){
    if(res.error){console.error(res.error);return;}
    employeeDB=(res.data||[]).map(rowToEmp);
    try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(e){}
    renderEmpDBList();
    loadEmployeePii();
  });
  client.from('dependents').select('*').order('id').then(function(res){
    if(res.error){console.error(res.error);return;}
    dependentsByEmp={};
    (res.data||[]).forEach(function(d){
      if(!dependentsByEmp[d.employee_id])dependentsByEmp[d.employee_id]=[];
      dependentsByEmp[d.employee_id].push(d);
    });
    renderEmpDBList();
  });
  client.from('employee_allowances').select('*').order('id').then(function(res){
    if(res.error){console.error(res.error);return;}
    allowancesByEmp={};
    (res.data||[]).forEach(function(a){
      if(!allowancesByEmp[a.employee_id])allowancesByEmp[a.employee_id]=[];
      allowancesByEmp[a.employee_id].push(a);
    });
    renderEmpDBList();
  });
}

function renderEmpDBList(){
  const box=document.getElementById('empdb-list');
  if(!employeeDB.length){box.innerHTML='<div style="padding:16px 18px;color:var(--ink-faint);font-size:15px">尚未建立任何員工資料</div>';return;}
  const indices=employeeDB.map((e,i)=>i);
  const byHireDate=(ia,ib)=>{
    const a=employeeDB[ia].hireDate||'',b=employeeDB[ib].hireDate||'';
    if(!a&&!b)return 0;
    if(!a)return 1;
    if(!b)return -1;
    return a<b?-1:(a>b?1:0);
  };
  const byResignDateDesc=(ia,ib)=>{
    const a=employeeDB[ia].resignDate||'',b=employeeDB[ib].resignDate||'';
    return a<b?1:(a>b?-1:0);
  };
  const active=indices.filter(i=>!employeeDB[i].resignDate).sort(byHireDate);
  const resigned=indices.filter(i=>employeeDB[i].resignDate).sort(byResignDateDesc);

  let baseSum=0, bonusSum=0;
  active.forEach(i=>{ baseSum+=(+employeeDB[i].base||0); bonusSum+=(+employeeDB[i].bonus||0); });

  const renderRow=(i,seq)=>{
    const e=employeeDB[i];
    const isResigned=!!e.resignDate;
    const gradeAmt=e.insGrade!==''&&e.insGrade!==undefined&&LABOR[e.insGrade]?LABOR[e.insGrade][0].toLocaleString('zh-TW'):'';
    let row='<tr class="emp-row'+(isResigned?' resigned':'')+'" onclick="toggleEmpExpand('+e.id+')">'
      +'<td class="c" style="color:var(--ink-faint)">'+seq+'</td>'
      +'<td><div class="name-cell"><span class="dot'+(isResigned?' off':'')+'"></span>'+(e.name||'（未命名）')+'</div></td>'
      +'<td>'+(isResigned?'<span class="dash">—</span>':'<span class="tenure-cell">'+ic('calendar')+(tenureFull(e.hireDate,null,e.tenureDeductMonths)||'<span class="dash">—</span>')+'</span>')+'</td>'
      +'<td class="r base-cell num">'+(e.base?Number(e.base).toLocaleString('zh-TW'):'<span class="dash">—</span>')+'</td>'
      +'<td class="r num" style="color:var(--ink-soft)">'+(e.bonus?Number(e.bonus).toLocaleString('zh-TW'):'<span class="dash">—</span>')+'</td>'
      +'<td class="r num" style="color:var(--ink-soft)">'+(gradeAmt||'<span class="dash">—</span>')+'</td>'
      +'<td class="c" onclick="event.stopPropagation()">'
      +(isResigned
        ? '<span class="pill-resigned">離職</span>'
        : '<button type="button" class="btn-icon" title="展開" onclick="toggleEmpExpand('+e.id+')">'+ic(expandedEmpId===e.id?'chevronUp':'chevronDown')+'</button> <button type="button" class="btn-icon danger" title="刪除" onclick="removeEmpDBRow('+i+')">'+ic('trash')+'</button>')
      +'</td>'
      +'</tr>';
    if(expandedEmpId===e.id)row+='<tr><td colspan="7" style="padding:0">'+renderEmpDetail(e,i)+'</td></tr>';
    return row;
  };

  let out='<table class="emp-table"><colgroup><col class="c-no"><col class="c-name"><col class="c-tenure"><col class="c-base"><col class="c-bonus"><col class="c-grade"><col class="c-op"></colgroup>';
  out+='<thead><tr><th>#</th><th>姓名</th><th>在職年資</th><th class="r">本薪</th><th class="r">全勤獎金</th><th class="r">投保級距</th><th class="c">操作</th></tr></thead><tbody>';
  out+=active.map((i,pos)=>renderRow(i,pos+1)).join('');
  if(resigned.length){
    out+='<tr class="resign-sep"><td colspan="7">已離職（'+resigned.length+'）</td></tr>';
    out+=resigned.map((i,pos)=>renderRow(i,active.length+pos+1)).join('');
  }
  out+='</tbody></table>';
  out+='<div class="list-foot"><span>在職 <b>'+active.length+'</b></span><span>本薪合計 <b>'+baseSum.toLocaleString('zh-TW')+'</b></span><span>全勤獎金合計 <b>'+bonusSum.toLocaleString('zh-TW')+'</b></span></div>';
  box.innerHTML=out;
}
function empFieldToColumn(field){
  const map={insGrade:'ins_grade',hireDate:'hire_date',resignDate:'resign_date',jobTitle:'job_title',healthInsGrade:'health_ins_grade',laborInsExempt:'labor_ins_exempt',raiseDate:'raise_effective_date',raiseNewBase:'raise_new_base',gradeEffDate:'grade_effective_date',gradeNewGrade:'grade_new_ins_grade',tenureDeductMonths:'tenure_deduct_months'};
  return map[field]||field;
}
function updateEmpDBField(i,field,val){
  const emp=employeeDB[i];
  if(!emp)return;
  emp[field]=val;
  try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(e){}
  if(!emp.id)return;
  const client=initSupabase();
  if(!client)return;
  const payload={};
  payload[empFieldToColumn(field)]=((field==='account'||field==='raiseDate'||field==='gradeEffDate')&&val==='')?null:val;
  client.from('employees').update(payload).eq('id',emp.id).then(function(res){
    if(res.error)console.error(res.error);
  });
}
function promoteRaise(i){
  const emp=employeeDB[i];
  if(!emp||!emp.raiseDate)return;
  if(!confirm('確定要把「'+emp.name+'」的正式本薪改成 '+(emp.raiseNewBase||0)+' 元，並清除調薪設定嗎？(之後計算器就不會再自動拆分本薪)'))return;
  updateEmpDBField(i,'base',emp.raiseNewBase||0);
  updateEmpDBField(i,'raiseDate','');
  updateEmpDBField(i,'raiseNewBase',0);
  renderEmpDBList();
}
function promoteGrade(i){
  const emp=employeeDB[i];
  if(!emp||!emp.gradeEffDate)return;
  const gradeAmt=(LABOR[emp.gradeNewGrade]||LABOR[0])[0].toLocaleString('zh-TW');
  if(!confirm('確定要把「'+emp.name+'」的正式投保級距改成 '+gradeAmt+' 元，並清除調整設定嗎？(之後計算器就不會再自動判斷級距生效日)'))return;
  updateEmpDBField(i,'insGrade',emp.gradeNewGrade||0);
  updateEmpDBField(i,'healthInsGrade',emp.gradeNewGrade||0);
  updateEmpDBField(i,'gradeEffDate','');
  updateEmpDBField(i,'gradeNewGrade',0);
  renderEmpDBList();
}
function addEmpDBRow(){
  const client=initSupabase();
  if(!client){alert('Supabase 載入失敗，請檢查網路連線');return;}
  client.from('employees').insert({account:null,password:'',name:'',base:0,bonus:0,ins_grade:0,dependents:0,job_title:'托育人員'}).select().then(function(res){
    if(res.error){alert('新增失敗：'+res.error.message);return;}
    employeeDB.push(rowToEmp(res.data[0]));
    try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(e){}
    renderEmpDBList();
  });
}
function removeEmpDBRow(i){
  const emp=employeeDB[i];
  if(!emp)return;
  if(!confirm('確定要刪除「'+(emp.name||'（未命名）')+'」嗎？'))return;
  const client=initSupabase();
  if(!client){alert('Supabase 載入失敗，請檢查網路連線');return;}
  client.from('employees').delete().eq('id',emp.id).then(function(res){
    if(res.error){alert('刪除失敗：'+res.error.message);return;}
    employeeDB.splice(i,1);
    delete dependentsByEmp[emp.id];
    delete allowancesByEmp[emp.id];
    try{localStorage.setItem('scEmployeeDB',JSON.stringify(employeeDB));}catch(e){}
    renderEmpDBList();
  });
}
function addDependent(empId){
  const client=initSupabase();
  if(!client){alert('Supabase 載入失敗，請檢查網路連線');return;}
  client.from('dependents').insert({employee_id:empId,name:'',relation:'',birth_date:null}).select().then(function(res){
    if(res.error){alert('新增失敗：'+res.error.message);return;}
    if(!dependentsByEmp[empId])dependentsByEmp[empId]=[];
    dependentsByEmp[empId].push(res.data[0]);
    renderEmpDBList();
  });
}
function updateDependentField(depId,field,val,shouldRerender){
  for(const empId in dependentsByEmp){
    const d=dependentsByEmp[empId].find(x=>x.id===depId);
    if(d){d[field]=val;break;}
  }
  const client=initSupabase();
  if(!client)return;
  const payload={};
  payload[field]=val;
  client.from('dependents').update(payload).eq('id',depId).then(function(res){
    if(res.error){console.error(res.error);return;}
    if(shouldRerender)renderEmpDBList();
  });
}
function removeDependent(empId,depId){
  if(!confirm('確定要刪除這筆眷屬資料嗎？'))return;
  const client=initSupabase();
  if(!client)return;
  client.from('dependents').delete().eq('id',depId).then(function(res){
    if(res.error){alert('刪除失敗：'+res.error.message);return;}
    dependentsByEmp[empId]=(dependentsByEmp[empId]||[]).filter(d=>d.id!==depId);
    renderEmpDBList();
  });
}
